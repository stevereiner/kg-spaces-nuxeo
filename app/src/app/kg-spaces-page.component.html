<div class="kg-spaces-page">
  <!-- the library's title bar: Nuxeo's user (the Web UI session is the sign-in there: no sign-out), the sign-in
       pill for the other sources in the stores, and the Dark / Light switch. No link back to Web UI: this tab sits
       next to Web UI's, and leaving it would drop a job being followed. -->
  <app-title-bar title="KG Spaces" icon="hub" hostSource="nuxeo" [hostUser]="user" [hostUrl]="nuxeoUrl">
  </app-title-bar>

  <div class="message" *ngIf="message">{{ message }}</div>

  <mat-card class="kg-spaces-card">
    <mat-tab-group [(selectedIndex)]="selectedTabIndex" class="kg-spaces-tabs full-width-tabs">
      <mat-tab label="OTHER SOURCES">
        <app-sources-tab
          (configureProcessing)="onConfigureProcessing()"
          (sourcesConfigured)="onSourcesConfigured($event)">
        </app-sources-tab>
      </mat-tab>

      <mat-tab label="PROCESSING">
        <app-processing-tab
          [hasConfiguredSources]="hasConfiguredSources"
          [configuredDataSource]="configuredDataSource"
          [configuredFiles]="configuredFiles"
          [configuredFolderPath]="configuredFolderPath"
          [repositoryItemsHidden]="repositoryItemsHidden"
          [configuredCmisConfig]="configuredCmisConfig"
          [configuredAlfrescoConfig]="configuredAlfrescoConfig"
          [configuredNuxeoConfig]="configuredNuxeoConfig"
          [configuredWebConfig]="configuredWebConfig"
          [configuredWikipediaConfig]="configuredWikipediaConfig"
          [configuredYoutubeConfig]="configuredYoutubeConfig"
          [configuredCloudConfig]="configuredCloudConfig"
          [configuredEnterpriseConfig]="configuredEnterpriseConfig"
          [configurationTimestamp]="configurationTimestamp"
          (goToSources)="selectedTabIndex = 0"
          (removeRepositoryFile)="removeRepositoryFile($event)"
          (removeUploadFile)="removeUploadFile($event)">
        </app-processing-tab>
      </mat-tab>

      <mat-tab label="HYBRID SEARCH">
        <app-search-tab></app-search-tab>
      </mat-tab>

      <mat-tab label="AI CHAT">
        <app-chat-tab [scope]="chatScope" (scopeChange)="chatScope = $event"></app-chat-tab>
      </mat-tab>
    </mat-tab-group>
  </mat-card>
</div>
